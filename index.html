<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Membro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #ffffff; }
        .info { margin: 20px 0; font-size: 16px; }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel do Integrante</h2>
        <div class="info">
            <p><strong>Membro:</strong> <span id="nome-membro">Carregando...</span></p>
            <p><strong>Status de Pagamento:</strong> <span id="status-pagamento">Verificando...</span></p>
        </div>

        <!-- Área restrita: Visível APENAS para administradores -->
        <div id="area-admin" style="display: none;">
            <hr style="border-color: #333; margin: 20px 0;">
            <p style="font-size: 14px; color: #aaa;">Painel Administrativo</p>
            <button id="btn-confirmar" onclick="confirmarPagamento()">Confirmar Pagamento</button>
        </div>
    </div>

    <!-- Script de Integração com Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ⚠️ SUBSTITUA COM AS SUAS CREDENCIAIS DO SUPABASE ⚠️
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarPainel() {
            // Pega o ID do membro que veio na URL (ex: painel.html?id=UUID)
            const params = new URLSearchParams(window.location.search);
            const membroIdAlvo = params.get('id');

            // Verifica quem está logado no momento
            const { data: { user }, error: authError } = await supabase.auth.getUser();
            
            if (authError || !user) {
                alert("Você precisa estar logado no sistema para acessar!");
                window.location.href = "login.html"; // Altere para a sua página de login, se necessário
                return;
            }

            // Descobre o cargo do usuário logado na tabela de perfis
            const { data: perfilLogado, error: perfilError } = await supabase
                .from('perfis')
                .select('cargo')
                .eq('id', user.id)
                .single();

            const isAdm = perfilLogado && perfilLogado.cargo === 'adm';

            // Se for adm e passou um ID na URL, carrega o membro alvo. Caso contrário, carrega o próprio usuário.
            const idParaCarregar = (isAdm && membroIdAlvo) ? membroIdAlvo : user.id;

            // Busca os dados do membro na tabela (ex: tabela 'membros')
            const { data: membroData, error: membroError } = await supabase
                .from('membros')
                .select('*')
                .eq('id', idParaCarregar)
                .single();

            if (membroError || !membroData) {
                document.getElementById('nome-membro').innerText = "Erro ao carregar dados.";
                document.getElementById('status-pagamento').innerText = "-";
                return;
            }

            // Preenche as informações na tela
            document.getElementById('nome-membro').innerText = membroData.nome || 'Usuário';
            document.getElementById('status-pagamento').innerText = membroData.status_pagamento || 'Pendente';

            // Regra do botão: Se for adm, mostra a div de administração. Se for membro comum, esconde.
            if (isAdm) {
                document.getElementById('area-admin').style.display = 'block';
            } else {
                document.getElementById('area-admin').style.display = 'none';
            }
        }

        // Função executada ao clicar no botão de confirmar pagamento (somente adm consegue usar)
        window.confirmarPagamento = async function() {
            const params = new URLSearchParams(window.location.search);
            const membroIdAlvo = params.get('id');

            if (!membroIdAlvo) {
                alert("ID do membro não encontrado na URL.");
                return;
            }

            const { error } = await supabase
                .from('membros')
                .update({ status_pagamento: 'Pago' })
                .eq('id', membroIdAlvo);

            if (!error) {
                alert("Pagamento confirmado com sucesso!");
                location.reload();
            } else {
                alert("Erro ao atualizar o pagamento no banco.");
                console.error(error);
            }
        }

        carregarPainel();
    </script>
</body>
</html>
