<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Clã Senju</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121214;
            color: #f2f3f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h2 {
            border-bottom: 2px solid #2b2d31;
            padding-bottom: 10px;
        }

        .admin-webhook-card {
            background: #1e1f22;
            border: 1px solid #35363c;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .admin-webhook-card h3 {
            margin-top: 0;
            color: #f2f3f5;
            font-size: 18px;
        }

        .webhook-desc {
            font-size: 14px;
            color: #949ba4;
            margin-bottom: 15px;
        }

        .webhook-switch-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* Estilo do Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #4e5058;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #248046;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .webhook-input-group {
            display: flex;
            gap: 10px;
        }

        .webhook-input-group input {
            flex: 1;
            background: #383a40;
            border: 1px solid #1f2023;
            border-radius: 8px;
            padding: 10px 14px;
            color: #f2f3f5;
            font-size: 14px;
        }

        .webhook-input-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-salvar {
            background: #5865f2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-salvar:hover:not(:disabled) {
            background: #4752c4;
        }

        .btn-salvar:disabled {
            background: #4e5058;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .webhook-status {
            display: block;
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel de Controle - Clã Senju</h2>

        <!-- Seção do Painel de Admin (Oculto por padrão) -->
        <div id="painel-admin-webhook" class="admin-webhook-card" style="display: none;">
            <h3>⚙️ Configuração de Webhook do Discord</h3>
            <p class="webhook-desc">Gerencie o link do Webhook usado nos sorteios, relatórios e recompensas.</p>

            <!-- Trava de Segurança (Switch) -->
            <div class="webhook-switch-container">
                <label class="switch">
                    <input type="checkbox" id="toggle-modo-edicao" onchange="alternarEdicaoWebhook()">
                    <span class="slider round"></span>
                </label>
                <span id="label-status-edicao">🔒 Modo de Edição Bloqueado</span>
            </div>

            <!-- Input e Botão de Salvar -->
            <div class="webhook-input-group">
                <input type="text" id="input-webhook-url" placeholder="https://discord.com/api/webhooks/..." disabled>
                <button id="btn-salvar-webhook" onclick="salvarWebhookSupabase()" disabled class="btn-salvar">Salvar Alteração</button>
            </div>
            <span id="webhook-msg-status" class="webhook-status"></span>
        </div>
    </div>

    <script>
        // Substitua pelas suas credenciais reais do Supabase
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CHAVE_WEBHOOK_DB = 'webhook_url';

        document.addEventListener("DOMContentLoaded", async () => {
            await checarPermissaoE2CarregarWebhook();
        });

        // 1. Verifica se é Admin e carrega o link atual
        async function checarPermissaoE2CarregarWebhook() {
            try {
                // Pega o usuário logado (ajuste conforme o sistema de login do seu site)
                const usuarioLogado = JSON.parse(localStorage.getItem('usuario_logado') || '{}');
                
                // Mude aqui a regra para identificar se é admin no seu site
                const ehAdmin = usuarioLogado.isAdmin || usuarioLogado.cargo === 'Administrador'; 

                if (!ehAdmin) {
                    document.getElementById('painel-admin-webhook').style.display = 'none';
                    return;
                }

                // Se for admin, exibe o painel
                document.getElementById('painel-admin-webhook').style.display = 'block';

                // Busca o webhook na tabela 'Configs'
                const { data, error } = await supabase
                    .from('Configs')
                    .select('valor')
                    .eq('chave', CHAVE_WEBHOOK_DB)
                    .single();

                if (data && data.valor) {
                    document.getElementById('input-webhook-url').value = data.valor;
                }
            } catch (err) {
                console.error("Erro ao carregar configurações do Webhook:", err);
            }
        }

        // 2. Trava de segurança (Switch)
        function alternarEdicaoWebhook() {
            const isChecked = document.getElementById('toggle-modo-edicao').checked;
            const inputField = document.getElementById('input-webhook-url');
            const btnSalvar = document.getElementById('btn-salvar-webhook');
            const labelStatus = document.getElementById('label-status-edicao');

            if (isChecked) {
                inputField.disabled = false;
                btnSalvar.disabled = false;
                labelStatus.innerHTML = "🔓 Modo de Edição Destravado";
                labelStatus.style.color = "#248046";
                inputField.focus();
            } else {
                inputField.disabled = true;
                btnSalvar.disabled = true;
                labelStatus.innerHTML = "🔒 Modo de Edição Bloqueado";
                labelStatus.style.color = "inherit";
            }
        }

        // 3. Salva a alteração na tabela Configs do Supabase
        async function salvarWebhookSupabase() {
            const novoUrl = document.getElementById('input-webhook-url').value.trim();
            const msgStatus = document.getElementById('webhook-msg-status');

            if (!novoUrl.startsWith('https://discord.com/api/webhooks/')) {
                msgStatus.style.color = '#ed4245';
                msgStatus.innerText = '⚠️ URL de Webhook inválida!';
                return;
            }

            msgStatus.style.color = '#f0b232';
            msgStatus.innerText = 'Salvando no Supabase...';

            try {
                const { error } = await supabase
                    .from('Configs')
                    .upsert({ chave: CHAVE_WEBHOOK_DB, valor: novoUrl }, { onConflict: 'chave' });

                if (error) throw error;

                msgStatus.style.color = '#248046';
                msgStatus.innerText = '✅ Webhook atualizado com sucesso!';
                
                // Trava o switch novamente por segurança
                document.getElementById('toggle-modo-edicao').checked = false;
                alternarEdicaoWebhook();

                setTimeout(() => { msgStatus.innerText = ''; }, 4000);
            } catch (err) {
                console.error(err);
                msgStatus.style.color = '#ed4245';
                msgStatus.innerText = '❌ Erro ao salvar webhook.';
            }
        }
    </script>
</body>
</html>
